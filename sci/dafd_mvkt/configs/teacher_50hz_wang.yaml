model:
  arch: resnet1d_wang
  in_channels: 12
  num_classes: 5
  proj_dim: 128

data:
  sampling_rate: 50
  mode: teacher
  leads: all
  normalize: zscore

training:
  epochs: 100
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  num_workers: 4
  seed: 42
  amp: false

outputs:
  dir: dafd_mvkt/outputs
  checkpoint: dafd_mvkt/outputs/teacher_12lead_50hz_wang_best.pt
