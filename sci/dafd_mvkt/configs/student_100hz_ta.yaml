model:
  in_channels: 1
  num_classes: 5
  base_channels: 64
  layers: [3, 4, 6, 3]
  proj_dim: 128
  dropout: 0.0

data:
  mode: hier
  sampling_hz: 100
  lead: II
  normalize: zscore

training:
  epochs: 60
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-5
  alpha_teacher: 0.3     # direct teacher MKD weight (optional, disabled by default)
  alpha_ta: 1.0          # TA MKD weight
  beta_ta_crf: 0.1       # TA contrastive weight
  gamma_feature: 0.2     # feature KD weight
  temperature: 2.0       # MKD soft-target temperature
  contrastive_temperature: 0.07
  feature_pool_size: 128
  grad_clip: 1.0
  num_workers: 4
  seed: 42
  amp: false
  scheduler: cosine

output:
  dir: outputs
  name: student_ii_100hz_hier
