model:
  in_channels: 1
  num_classes: 5
  base_channels: 64
  layers: [3, 4, 6, 3]
  proj_dim: 128
  dropout: 0.0

data:
  mode: simclr
  sampling_hz: 100
  lead: II
  normalize: zscore

pretraining:
  temperature: 0.1
  augment:
    p_noise: 0.8
    min_noise_std: 0.02
    max_noise_std: 0.10
    p_scale: 0.8
    scale_lo: 0.8
    scale_hi: 1.2
    p_mask: 0.5
    n_masks: 2
    mask_len_frac: 0.05
    p_wander: 0.3
    wander_amp: 0.10
    p_shift: 0.3
    max_shift: 50

training:
  epochs: 100
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  num_workers: 4
  seed: 0

output:
  dir: dafd_mvkt/outputs/simclr
  name: simclr_II_100hz
