model:
  in_channels: 12
  num_classes: 5
  base_channels: 64
  layers: [3, 4, 6, 3]      # ResNet-34
  proj_dim: 128
  dropout: 0.0

data:
  sampling_rate: 500         # Hz — load records500/
  mode: teacher              # returns teacher_x only
  leads: all                 # all 12 leads
  normalize: zscore

training:
  epochs: 100
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine          # cosine | plateau
  grad_clip: 1.0
  num_workers: 4
  seed: 42
  amp: false

outputs:
  dir: outputs/teacher
  checkpoint: outputs/teacher_best.pt
