model:
  in_channels: 1
  num_classes: 5
  base_channels: 64
  layers: [3, 4, 6, 3]
  proj_dim: 128
  dropout: 0.0

data:
  sampling_rate: 50
  lead: II
  normalize: zscore

training:
  epochs: 100
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  num_workers: 8
  seed: 42
  amp: false

  lambda_kd: 1.0
  temperature: 2.0

outputs:
  dir: dafd_mvkt/outputs
